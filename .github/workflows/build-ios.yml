name: Ely iOS IPA

on:
  push:
    branches: [ios-native-media]
    paths: ['integration/**', '.github/workflows/build-ios.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ely-ios-client
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      IOS_DEPLOYMENT_TARGET: '15.0'
      CCACHE_BASEDIR: ${{ github.workspace }}
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4
        with:
          path: control
      - name: Checkout complete BestClient source
        uses: actions/checkout@v4
        with:
          repository: BestProjectTeam/BestClient
          ref: a16988e3b7e99d219ca2741064c3ba5a121fa706
          submodules: recursive
          path: source
      - name: Apply mobile port
        run: |
          python3 control/integration/apply_port.py source
          python3 control/integration/fix_build.py source
          python3 control/integration/runtime/fix_runtime.py source
          python3 control/integration/stability/fix_stability.py source
          python3 control/integration/voice-fix/fix_voice.py source
          python3 control/integration/no-voice/remove_voice.py source
          python3 control/integration/ely-update/apply_update.py source
          python3 control/integration/edge-fix/fix_edges.py source
          python3 control/integration/home-update/apply_home.py source
      - name: Test touch release and mobile frame profile
        run: |
          clang++ -std=c++20 -Wall -Wextra -Werror -Isource/src \
            control/integration/runtime/touch_dispatch_test.cpp -o touch-runtime-test
          ./touch-runtime-test
          clang++ -std=c++20 -DCONF_PLATFORM_IOS -Wall -Wextra -Werror -Isource/src \
            control/integration/stability/frame_pool_test.cpp -o frame-pool-test
          ./frame-pool-test
          clang++ -std=c++20 -Wall -Wextra -Werror -Isource/src \
            control/integration/ely-update/touch_aim_test.cpp -o touch-aim-test
          ./touch-aim-test
      - name: Save complete merged source
        working-directory: source
        run: |
          git config user.name 'Ely build'
          git config user.email 'ely-build@users.noreply.github.com'
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          mkdir -p upstream-ci
          mv .github/workflows/* upstream-ci/
          git add -A
          TREE=$(git write-tree)
          if git fetch origin source-ios-native-media; then
            COMMIT=$(git commit-tree "$TREE" -p FETCH_HEAD -m "Merge pinned iOS DDNet port with BestClient")
          else
            COMMIT=$(git commit-tree "$TREE" -m "Merge pinned iOS DDNet port with BestClient")
          fi
          git push origin "${COMMIT}:refs/heads/source-ios-native-media"
      - name: Verify pinned iOS libraries
        working-directory: source
        run: |
          test -d ddnet-libs/sdl/ios/libSDL2.xcframework/ios-arm64
          test -d ddnet-libs/opus/ios/libopus.xcframework/ios-arm64
          test -d ddnet-libs/curl/ios/libcurl.xcframework/ios-arm64
      - name: Install build tools and Rust target
        run: |
          brew install cmake ninja ccache
          rustup target add aarch64-apple-ios
      - uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ely-ios-ccache-v1-${{ github.run_id }}
          restore-keys: ely-ios-ccache-v1-
      - name: Check native iOS adapters
        run: |
          xcrun --sdk iphoneos clang++ -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=15.0 -std=c++20 -fobjc-arc \
            -fsyntax-only -Isource/src -Isource/src/engine/external \
            source/src/ios/ios_music.mm source/src/ios/ios_media.mm source/src/ios/ios_performance.mm
      - name: Configure iPhone arm64 build
        working-directory: source
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_RUST_COMPILER_TARGET=aarch64-apple-ios \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLIENT_EXECUTABLE=ElyClient \
            -DIOS_BUNDLE_IDENTIFIER=org.ely.client \
            -DPREFER_BUNDLED_LIBS=ON \
            -DSERVER=OFF -DTOOLS=OFF -DVULKAN=OFF -DVIDEORECORDER=OFF \
            -DAUTOUPDATE=OFF -DDISCORD=OFF -DSTEAM=OFF \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY= \
            -DCMAKE_XCODE_ATTRIBUTE_CC="$GITHUB_WORKSPACE/control/integration/ccache-clang.sh" \
            -DCMAKE_XCODE_ATTRIBUTE_CXX="$GITHUB_WORKSPACE/control/integration/ccache-clangxx.sh" \
            -DCMAKE_XCODE_ATTRIBUTE_COMPILER_INDEX_STORE_ENABLE=NO
      - name: Compile client
        working-directory: source
        run: cmake --build build-ios --config Release --target game-client --parallel 3
      - name: Package and verify IPA
        working-directory: source
        run: |
          python3 ../control/integration/package_ipa.py build-ios ../ElyClient-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ElyClient-unsigned-IPA
          path: ElyClient-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/Library/Caches/ccache
          key: ely-ios-ccache-v1-${{ github.run_id }}
